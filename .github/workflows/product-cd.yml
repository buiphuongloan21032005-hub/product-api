name: Product API CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for Product API healthcheck
        run: |
          echo "Waiting for Product API..."

          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              product-api 2>/dev/null || echo "starting")

            echo "Attempt $i - Product API status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Product API is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Product API healthcheck failed"
          docker compose logs
          exit 1

      - name: Test API health
        run: curl --fail http://localhost:3000/health

      - name: Stop test containers
        if: always()
        run: docker compose down -v

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            phuongloan21/product-api:latest

  deploy-local:
    needs: cd
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker images
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to Local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Show containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Wait for Product API healthcheck
        run: |
          echo "Waiting for Product API..."

          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              product-api 2>/dev/null || echo "starting")

            echo "Attempt $i - Product API status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Local Product API is healthy"
              exit 0
            fi

            sleep 2
          done

          echo "Local Product API did not become healthy"
          docker compose -f docker-compose-prod.yaml logs
          exit 1
